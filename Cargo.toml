[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/shared",
    "crates/desktop",
    "crates/web",
]

# Shared metadata for all workspace packages
[workspace.package]
version = "0.1.0"
authors = ["Liam"]
edition = "2021"

[workspace.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-wasm = "0.2"
shared = { path = "crates/shared" }
app = { path = "crates/app" }
thiserror = "2.0"
wasm-bindgen = "0.2"
num = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
