[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/shared",
    "crates/desktop",
    "crates/web",
]

# Shared metadata for all workspace packages
[workspace.package]
version = "1.2.0"
authors = ["Liam"]
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "tracing-log"] }
tracing-wasm = "0.2"
shared = { path = "crates/shared" }
app = { path = "crates/app" }
thiserror = "2.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlDocument", "Location"] }
console_error_panic_hook = "0.1.7"
num = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 2
codegen-units = 256

[profile.dev]
opt-level = 0
debug = true

[profile.dev.build-override]
opt-level = 1
codegen-units = 256
