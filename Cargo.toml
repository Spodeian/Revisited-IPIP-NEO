[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/shared",
    "crates/desktop",
    "crates/web",
]

# Shared metadata for all workspace packages
[workspace.package]
version = "1.5.0"
authors = ["Liam"]
edition = "2024"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/Spodeian/Revisited-IPIP-NEO"
homepage = "https://ipip-neo.spodeian.trade"
readme = "README.md"
description = "Scientifically robust psychometric assessment implementing Taxonomic Graph Analysis (TGA) of the IPIP-NEO in Rust & WebAssembly"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "tracing-log"] }
tracing-wasm = "0.2"
shared = { path = "crates/shared" }
app = { path = "crates/app" }
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlDocument", "Location"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
bson = "2"
miniz_oxide = "0.8"
base64 = "0.22"
num = "0.4"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
rpath = false

[profile.release.build-override]
opt-level = 2
codegen-units = 256

[profile.dev]
opt-level = 0
debug = true

[profile.dev.build-override]
opt-level = 1
codegen-units = 256
