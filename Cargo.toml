[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/shared",
    "crates/desktop",
    "crates/web",
]

# Shared metadata for all workspace packages
[workspace.package]
version = "1.6.1"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/Spodeian/Revisited-IPIP-NEO"
homepage = "https://ipip-neo.spodeian.trade"
readme = "README.md"
description = "Scientifically robust psychometric assessment implementing Taxonomic Graph Analysis (TGA) of the IPIP-NEO in Rust & WebAssembly"

[workspace.dependencies]
proptest = "1"
serde = "1"
serde_json = "1"
bson = "3"
ron = "0.12"
base64 = "0.23"
num = "0.4"
eframe = { version = "0.36", default-features = false }
egui = { version = "0.36", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-web = "0.1"
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
miniz_oxide = "0.9"
rfd = "0.17"
mimalloc = "0.1"
shared = { path = "crates/shared" }
app = { path = "crates/app" }
winit = { version = "0.30", default-features = false }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
spodeian-cache = { path = "../spodeian-core/crates/spodeian-cache" }
spodeian-tokens = { path = "../spodeian-core/crates/spodeian-tokens" }
spodeian-telemetry = { path = "../spodeian-core/crates/spodeian-telemetry" }
spodeian-export = { path = "../spodeian-core/crates/spodeian-export" }
spodeian-web-utils = { path = "../spodeian-core/crates/spodeian-web-utils" }
spodeian-ui = { path = "../spodeian-core/crates/spodeian-ui" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
rpath = false

[profile.release.build-override]
opt-level = 2
codegen-units = 256

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 0
codegen-units = 256
debug = true

[profile.dev.build-override]
opt-level = 2
