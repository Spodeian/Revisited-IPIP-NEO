[package]
name = "shared"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core psychometric models, scoring calculations, datasets, and serialization formats for Revisited IPIP-NEO"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bson = { workspace = true }
miniz_oxide = { workspace = true }
num = { workspace = true }

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "num/std"]

[dev-dependencies]
proptest = "1"
