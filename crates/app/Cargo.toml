[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application view controller, UI layout components, and state management for Revisited IPIP-NEO"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bson = { workspace = true }
base64 = { workspace = true }
ron = { workspace = true }
eframe = { workspace = true, features = ["default_fonts"] }
egui = { workspace = true, features = ["default_fonts"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi", "tracing-log"] }
miniz_oxide = { workspace = true }
thiserror = { workspace = true }
rfd = { workspace = true }
shared = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["HtmlDocument", "Window", "Document", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Location", "Storage"] }
js-sys = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android-activity = { workspace = true }

[features]
default = ["accesskit", "persistence", "wgpu"]
accesskit = ["eframe/accesskit"]
persistence = ["eframe/persistence"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]
