[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Application view controller, UI layout components, and state management for Revisited IPIP-NEO"

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
egui = { workspace = true, features = ["default_fonts"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
shared = { workspace = true }
bson = { workspace = true }
miniz_oxide = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
rfd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["HtmlDocument", "Window", "Document", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Location"] }
js-sys = { workspace = true }
