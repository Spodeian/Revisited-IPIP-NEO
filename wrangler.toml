# Cloudflare Wrangler Configuration for Revisited IPIP-NEO Personality Assessment
name = "revisited-ipip-neo"
compatibility_date = "2026-08-16"

# Disable the default workers.dev subdomain route
workers_dev = false

# Route this Worker to your custom domain
[[routes]]
pattern = "tga-ipip-neo.spodeian.trade"
zone_name = "spodeian.trade"
custom_domain = true

# 1. Directory of compiled static assets for Worker Sites / wrangler dev
[assets]
directory = "crates/web/dist"

# 2. Directory of compiled static assets for Cloudflare Pages / wrangler pages dev
pages_build_output_dir = "crates/web/dist"

# Enable observability logs as configured remotely
[observability.logs]
enabled = true

[observability.traces]
enabled = true
